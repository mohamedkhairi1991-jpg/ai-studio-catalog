name: Database validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-validation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  db-tests:
    name: Run SQL / RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" makes a GitHub API lookup that timed out several times on 2026-11-08.
          version: 3.0.0
      - name: Start local Supabase and apply migrations
        run: supabase start
      - name: Run database tests
        run: supabase test db
