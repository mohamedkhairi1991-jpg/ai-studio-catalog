name: Web validation

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  web:
    name: Type-check and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
